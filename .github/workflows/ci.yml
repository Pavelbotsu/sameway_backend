# Backend CI: vet, tests (PostGIS via testcontainers — Docker is available on
# ubuntu runners), known-vulnerability scan, and a secret scan so a key never
# lands in the repo again (see the 2026 audit, P0-1).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet
        run: go vet ./...
      - name: format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: test
        # -p 1: every test package starts its own PostGIS container.
        run: go test ./... -count=1 -p 1
      - name: race
        run: go test -race ./middleware/ ./services/ranker/ -count=1

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
