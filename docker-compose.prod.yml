# Production stack: PostGIS + backend + Caddy (automatic HTTPS).
#
#   1. Copy .env.prod.example to .env and fill in the values.
#   2. Put serviceAccountKey.json next to this file (never in the image).
#   3. docker compose -f docker-compose.prod.yml up -d --build
#
# The ${VAR:?...} interpolations make compose refuse to start with missing
# secrets, so insecure defaults can never reach the server.

services:
  db:
    image: postgis/postgis:15-3.3
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - POSTGRES_DB=rideshare
    # NOTE: no published ports — the database is reachable only from the
    # compose network. Never expose 5432 on a public server.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rideshare"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    # Logs hold IP addresses and request paths (Privacy Policy: overwritten,
    # at most 30 MB kept).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
      osrm-car:
        condition: service_started
      osrm-foot:
        condition: service_started
    environment:
      # prod: enforces a real JWT_SECRET, refuses the public OSRM demo and
      # keeps diagnostic endpoints off.
      - APP_ENV=prod
      - PORT=8080
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - DB_NAME=rideshare
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - JWT_TTL_HOURS=${JWT_TTL_HOURS:-168}
      - FIREBASE_CREDENTIALS_PATH=/secrets/serviceAccountKey.json
      # Self-hosted routing (osrm-* services below). The public demo server
      # is rate-limited and forbids production use.
      - OSRM_BASE_URL=${OSRM_BASE_URL:-http://osrm-car:5000}
      - OSRM_FOOT_BASE_URL=${OSRM_FOOT_BASE_URL:-http://osrm-foot:5000}
      # Matching: how long a driver's last GPS fix stays usable. Every match
      # path (corridor, reverse trigger, micro-detour, accept re-validation)
      # gates on this. The 30s code default assumed a foreground app pinging
      # every 15s — a driver whose screen is off went unmatchable almost
      # immediately. 120s tolerates normal Android scheduling jitter.
      - MATCH_LOC_FRESH_S=${MATCH_LOC_FRESH_S:-120}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - AI_RANKER_ENABLED=${AI_RANKER_ENABLED:-false}
      - AI_PROVIDER_URL=${AI_PROVIDER_URL:-}
      - AI_PROVIDER_API_KEY=${AI_PROVIDER_API_KEY:-}
      - AI_MODEL_NAME=${AI_MODEL_NAME:-}
      # Profile photos (uploaded through the API, metadata stripped).
      - PHOTO_DIR=/data/photos
    volumes:
      - ./serviceAccountKey.json:/secrets/serviceAccountKey.json:ro
      - photos:/data/photos
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Nightly logical backups (pg_dump custom format) into ./backups on the
  # host, keeping BACKUP_KEEP_DAYS days. This only protects against database
  # mistakes and corruption — copy ./backups OFF this machine (rclone, rsync,
  # object storage) or a disk failure takes the backups with it. Restore and
  # the restore drill: scripts/restore.sh.
  backup:
    image: postgis/postgis:15-3.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - PGHOST=db
      - PGUSER=postgres
      - PGDATABASE=rideshare
      - PGPASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-14}
      - BACKUP_HOUR_UTC=${BACKUP_HOUR_UTC:-2}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
      - photos:/photos:ro
    entrypoint: ["/bin/bash", "/backup-loop.sh"]


  # ── Self-hosted routing (OSRM): Małopolska + Poltava oblast ─────────────
  # osrm-data downloads and cuts the map (docker/osrm/fetch-map.sh),
  # osrm-build prepares car + walking routing data (docker/osrm/build.sh);
  # both are one-shot and skip work that is already done. Monthly refresh:
  #   OSRM_REFRESH=1 docker compose up osrm-data osrm-build
  #   docker compose restart osrm-car osrm-foot
  osrm-data:
    image: debian:bookworm-slim
    restart: "no"
    environment:
      - FORCE=${OSRM_REFRESH:-0}
    volumes:
      - osrm:/data
      - ./docker/osrm:/scripts:ro
    entrypoint: ["sh", "/scripts/fetch-map.sh"]

  osrm-build:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    restart: "no"
    depends_on:
      osrm-data:
        condition: service_completed_successfully
    volumes:
      - osrm:/data
      - ./docker/osrm:/scripts:ro
    entrypoint: ["sh", "/scripts/build.sh"]

  # One osrm-routed per profile: it serves a single dataset and ignores the
  # profile name in the URL. Internal network only (no ports published).
  osrm-car:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    restart: unless-stopped
    depends_on:
      osrm-build:
        condition: service_completed_successfully
    volumes:
      - osrm:/data:ro
    command: ["osrm-routed", "--algorithm", "mld", "/data/car/region.osrm"]

  osrm-foot:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    restart: unless-stopped
    depends_on:
      osrm-build:
        condition: service_completed_successfully
    volumes:
      - osrm:/data:ro
    command: ["osrm-routed", "--algorithm", "mld", "/data/foot/region.osrm"]
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?set DOMAIN in .env (e.g. sameway.duckdns.org)}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  photos:
  osrm:
  caddy_data:
  caddy_config:
