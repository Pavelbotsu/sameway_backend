version: '3.8'

services:
  # The Database
  db:
    image: postgis/postgis:15-3.3 # Image with PostGIS 
    container_name: rideshare-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=rideshare
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data 

volumes:
  postgres_data: